<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | BorewellPro Engineering</title>
  <meta name="description" content="Register an account with BorewellPro to track site visit appointments, drilling depth logs, and pump warranty certificates.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-alt d-flex flex-column min-vh-100">

  <!-- Header Nav (Simplified) -->
  <header class="site-header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon-box"><i class="bi bi-droplet-half"></i></div>
        <span>Borewell<span class="brand-accent">Pro</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle dark mode"><i class="bi bi-moon-stars-fill"></i></button>
        <button type="button" class="rtl-toggle-btn" title="Toggle RTL"><i class="bi bi-text-right"></i></button>
        <a href="login.html" class="btn btn-outline-water btn-sm d-none d-sm-inline-flex"><i class="bi bi-box-arrow-in-right me-1"></i> Already Member?</a>
      </div>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="my-auto py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
          <div class="bg-white border rounded-3 p-4 p-md-5 shadow-lg">
            <div class="text-center mb-4">
              <div class="brand-icon-box mx-auto mb-3" style="width:50px;height:50px;font-size:1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h1 class="h3 fw-bold mb-1">Create Your Account</h1>
              <p class="text-muted small">Register to track drilling logs, soil reports, and service warranties.</p>
            </div>

            <!-- Form Alert Container -->
            <div id="registerAlertPlaceholder"></div>

            <form id="registerForm" novalidate>
              <!-- Full Name -->
              <div class="mb-3">
                <label for="regFullName" class="form-label">Full Name *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" id="regFullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                </div>
              </div>

              <!-- Email & Phone in Row -->
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label for="regEmail" class="form-label">Email Address *</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
                  </div>
                </div>
                <div class="col-sm-6">
                  <label for="regPhone" class="form-label">Phone Number *</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="tel" id="regPhone" class="form-control" placeholder="10-digit Mobile" required>
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="regPassword" class="form-label">Password * (Min 8 Characters)</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="regPassword" class="form-control" placeholder="Create strong password" required>
                  <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="regPassword" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-3">
                <label for="regConfirmPassword" class="form-label">Confirm Password *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-type password" required>
                  <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="regConfirmPassword" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Terms Checkbox -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="regTerms" required>
                <label class="form-check-label small text-muted" for="regTerms">
                  I agree to the <a href="about.html" class="text-primary text-decoration-underline">Terms of Service</a> and <a href="about.html" class="text-primary text-decoration-underline">Privacy Policy</a>.
                </label>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-water w-100 py-2 fw-bold">
                <i class="bi bi-check2-circle me-1"></i> Create Account
              </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-muted">
              Already have an account? <a href="login.html" class="fw-bold text-primary">Login here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div data-footer-component></div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/dark-mode.js"></script>
  <script src="assets/js/form-validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
