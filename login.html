<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BorewellPro Engineering</title>
  <meta name="description" content="Sign in to your BorewellPro portal to manage field drilling orders, site reports, and project schedules.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-alt d-flex flex-column min-vh-100">

  <!-- Header Nav (Simplified) -->
  <header class="site-header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon-box"><i class="bi bi-droplet-half"></i></div>
        <span>Borewell<span class="brand-accent">Pro</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle dark mode"><i class="bi bi-moon-stars-fill"></i></button>
        <button type="button" class="rtl-toggle-btn" title="Toggle RTL"><i class="bi bi-text-right"></i></button>
        <a href="index.html" class="btn btn-outline-water btn-sm d-none d-sm-inline-flex"><i class="bi bi-arrow-left me-1"></i> Back Home</a>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="my-auto py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="bg-white border rounded-3 p-4 p-md-5 shadow-lg">
            <div class="text-center mb-4">
              <div class="brand-icon-box mx-auto mb-3" style="width:50px;height:50px;font-size:1.5rem;">
                <i class="bi bi-shield-lock-fill"></i>
              </div>
              <h1 class="h3 fw-bold mb-1">Welcome Back</h1>
              <p class="text-muted small">Sign in to manage your site inspections and water reports.</p>
            </div>

            <!-- Flash & Error Alert Container -->
            <div id="loginAlertPlaceholder"></div>

            <form id="loginForm" novalidate>
              <!-- Email -->
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" value="admin@borewellpro.com" required>
                </div>
              </div>

              <!-- Password with Show/Hide -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="loginPassword" class="form-label">Password *</label>
                  <a href="#" class="small text-primary text-decoration-none">Forgot Password?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" value="password123" required>
                  <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Remember Me -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember this device for 30 days
                </label>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-water w-100 py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
              </button>

              <div class="p-2 bg-alt rounded text-center small text-muted mt-3">
                <i class="bi bi-info-circle me-1 text-primary"></i> Demo credentials pre-filled. Click <strong>Login</strong> to sign in.
              </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-muted">
              Don't have an account? <a href="register.html" class="fw-bold text-primary">Create Account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Simplified Footer -->
  <div data-footer-component></div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/dark-mode.js"></script>
  <script src="assets/js/form-validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
