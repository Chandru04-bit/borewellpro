<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations Portal | BorewellPro</title>
  <meta name="description" content="Administrative login console for BorewellPro drilling machinery dispatch, hydrogeological logs, and inquiry management.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-alt d-flex flex-column min-vh-100">

  <!-- Top Minimal Bar -->
  <div class="py-3 border-bottom bg-white">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="index.html">
        <div class="brand-icon-box"><i class="bi bi-droplet-half"></i></div>
        <span>Borewell<span class="brand-accent">Pro</span></span>
        <span class="badge bg-danger ms-2">Admin Portal</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle dark mode"><i class="bi bi-moon-stars-fill"></i></button>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Public Site</a>
      </div>
    </div>
  </div>

  <!-- Login Form Container -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
          <div class="card border shadow-lg rounded-3 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
              <div class="d-inline-flex p-3 rounded-circle bg-danger-subtle text-danger mb-3">
                <i class="bi bi-shield-lock-fill fs-2"></i>
              </div>
              <h2 class="fw-bold mb-1">Administrative Control</h2>
              <p class="text-muted small mb-0">Restricted access for field managers and drilling engineers.</p>
            </div>

            <!-- Error / Alert Placeholder -->
            <div id="adminAlertPlaceholder"></div>

            <form id="adminLoginForm" novalidate>
              <!-- Email Address -->
              <div class="mb-3">
                <label for="adminEmail" class="form-label fw-semibold">Admin Email *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                  <input type="email" id="adminEmail" class="form-control" placeholder="admin@borewellpro.com" required>
                </div>
              </div>

              <!-- Password with Eye Toggle -->
              <div class="mb-3">
                <label for="adminPassword" class="form-label fw-semibold">Admin Password *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" id="adminPassword" class="form-control" placeholder="Enter admin password" required>
                  <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="adminPassword" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Remember & Security Pin -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="adminRemember">
                  <label class="form-check-label small text-muted" for="adminRemember">
                    Remember session
                  </label>
                </div>
                <span class="badge bg-secondary-subtle text-secondary small">SSL 256-bit Encrypted</span>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
                <i class="bi bi-shield-check me-2"></i> Authenticate & Enter Console
              </button>
            </form>

            <!-- Demo Credentials Helper Pill -->
            <div class="mt-4 pt-3 border-top text-center">
              <div class="small text-muted mb-2">Test Demo Admin Credentials:</div>
              <button type="button" class="btn btn-sm btn-outline-danger w-100" id="btnFillAdminDemo">
                <i class="bi bi-magic me-1"></i> Quick Fill: admin@borewellpro.com / password123
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small text-muted border-top bg-white">
    &copy; 2026 BorewellPro Groundwater Engineering. Administrative Portal.
  </footer>

  <!-- Scripts -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/dark-mode.js"></script>
  <script>
    // Quick fill helper
    document.getElementById('btnFillAdminDemo').addEventListener('click', () => {
      document.getElementById('adminEmail').value = 'admin@borewellpro.com';
      document.getElementById('adminPassword').value = 'password123';
    });

    // Password Toggle
    document.querySelectorAll('.btn-toggle-password').forEach(btn => {
      btn.addEventListener('click', function() {
        const target = document.getElementById(this.getAttribute('data-target'));
        const icon = this.querySelector('i');
        if (target.type === 'password') {
          target.type = 'text';
          icon.className = 'bi bi-eye-slash';
        } else {
          target.type = 'password';
          icon.className = 'bi bi-eye';
        }
      });
    });

    // Admin Login Submission
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim().toLowerCase();
      const pass = document.getElementById('adminPassword').value;
      const placeholder = document.getElementById('adminAlertPlaceholder');

      if (email === 'admin@borewellpro.com' && pass === 'password123') {
        const sessionData = {
          name: 'Admin Operations',
          email: 'admin@borewellpro.com',
          phone: '+91 98765 43210',
          role: 'admin'
        };
        localStorage.setItem('borewellpro_current_user', JSON.stringify(sessionData));
        window.location.href = 'admin-dashboard.html';
      } else {
        placeholder.innerHTML = `
          <div class="alert alert-danger d-flex align-items-center alert-dismissible fade show mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>Invalid administrative credentials. Use the Demo Admin button below.</div>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
